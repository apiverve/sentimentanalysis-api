[project]
name = "apiverve-sentimentanalysis"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Sentiment Analysis evaluates the emotional tone of any text string. It returns an AFINN valence score, a comparative word-normalized score, and a five-tier sentiment label from very negative to very positive."
keywords = ["sentiment analysis api", "sentiment api", "free sentiment analysis api", "social media sentiment analysis api", "text analysis api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/sentimentanalysis?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/sentimentanalysis?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/sentimentanalysis-api"
Twitter = "https://twitter.com/apivervehq"
